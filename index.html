<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kk_eat - 每日食譜管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .hidden-section { display: none; }
        
        /* 備註區塊摺疊效果 */
        .recipe-notes-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease;
            opacity: 0;
        }
        .recipe-notes-container.expanded {
            max-height: 2000px;
            opacity: 1;
            transition: max-height 0.5s ease-in, opacity 0.3s ease;
        }
        
        /* 卡片佈局優化：確保高度自適應，防止浮空跑版 */
        .dish-card {
            display: flex;
            flex-direction: column;
            height: fit-content;
            align-self: start;
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- 導航欄 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-600 flex items-center">
                <i class="fas fa-utensils mr-2"></i> kk_eat
            </h1>
            <button id="adminToggle" class="text-sm bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-full transition">
                <i class="fas fa-cog mr-1"></i> 編輯模式
            </button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- 日期導覽 -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 flex flex-wrap items-center justify-between gap-4 border border-slate-100">
            <div class="flex items-center gap-2">
                <button id="prevDayBtn" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-3 py-2 rounded-lg transition flex items-center">
                    <i class="fas fa-chevron-left mr-1"></i> 前一天
                </button>
                <button id="todayBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium transition flex items-center">
                    今天
                </button>
                <button id="nextDayBtn" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-3 py-2 rounded-lg transition flex items-center">
                    後一天 <i class="fas fa-chevron-right ml-1"></i>
                </button>
            </div>
            <div class="flex items-center gap-3">
                <label for="datePicker" class="font-medium text-slate-500 text-sm">查看日期：</label>
                <input type="date" id="datePicker" class="border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>
        </div>

        <!-- 內容顯示區 -->
        <div id="displaySection">
            <div id="menuContent" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-start">
                <!-- 菜色清單會動態插入這裡 -->
            </div>
        </div>

        <!-- 管理編輯區 -->
        <div id="adminSection" class="hidden-section mt-12 pt-8 border-t-2 border-slate-200">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-xl font-black text-slate-800">管理中心 (<span id="editingDate"></span>)</h2>
                    <p class="text-sm text-slate-400">在此修改後，複製下方的 JSON 代碼存回檔案即可。</p>
                </div>
                <div class="flex gap-2">
                    <button id="autoSortBtn" class="text-xs bg-slate-100 text-slate-600 hover:bg-slate-200 px-4 py-2 rounded-full transition border border-slate-200">
                        <i class="fas fa-sort-amount-down-alt mr-1"></i> 按類別排序
                    </button>
                    <button id="closeAdmin" class="text-slate-400 hover:text-slate-600 p-2"><i class="fas fa-times text-xl"></i></button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- 左側：編輯表單 -->
                <div class="lg:col-span-2 space-y-6">
                    <div id="dishEditorList" class="space-y-6">
                        <!-- 動態生成多組輸入框 -->
                    </div>
                    
                    <div class="flex gap-3">
                        <button id="addDishBtn" class="flex-[2] py-4 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 hover:border-emerald-500 hover:text-emerald-500 transition-all flex items-center justify-center gap-2">
                            <i class="fas fa-plus-circle"></i> 新增一道菜色
                        </button>
                        <button id="pasteDishBtn" class="hidden flex-1 py-4 bg-orange-50 border-2 border-dashed border-orange-200 rounded-2xl text-orange-500 hover:bg-orange-100 hover:border-orange-400 transition-all flex items-center justify-center gap-2 font-bold">
                            <i class="fas fa-paste"></i> 貼上菜色
                        </button>
                    </div>
                </div>

                <!-- 右側：JSON 輸出與雙向編輯 -->
                <div class="lg:col-span-1">
                    <div class="sticky top-24">
                        <h3 class="font-bold text-slate-600 mb-4 flex items-center justify-between">
                            雙向編輯 JSON
                            <span id="syncIndicator" class="text-[10px] bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded transition-all">Auto Sync</span>
                        </h3>
                        <textarea id="jsonOutput" class="w-full h-[500px] bg-slate-900 border border-slate-800 rounded-2xl p-4 text-[11px] font-mono text-emerald-400 shadow-inner resize-none focus:ring-2 focus:ring-emerald-500 outline-none" spellcheck="false"></textarea>
                        <div class="flex gap-2 mt-4">
                            <button id="copyJson" class="flex-1 bg-emerald-600 text-white font-bold py-4 rounded-2xl hover:bg-emerald-700 transition shadow-lg shadow-emerald-200 flex items-center justify-center">
                                <i class="fas fa-copy mr-2"></i> 複製代碼
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none z-50 text-sm transition-all"></div>

    <script>
        const getLocalDateString = (date = new Date()) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const todayStr = getLocalDateString();
        const categoryIcons = {
            '主食': 'fa-bowl-rice',
            '配菜': 'fa-stroopwafel',
            '湯品': 'fa-mug-hot',
            '甜點': 'fa-ice-cream',
            '霄夜': 'fa-moon',
            '其他': 'fa-utensils'
        };

        const categoryPriority = {
            '主食': 1,
            '配菜': 2,
            '湯品': 3,
            '甜點': 4,
            '霄夜': 5,
            '其他': 6
        };

        let dishClipboard = null;

        // 預設範例資料
        let menuData = {
            [todayStr]: [
                {
                    "category": "主食",
                    "name": "白飯",
                    "ingredients": "白米、水",
                    "notes": "1. 洗米兩次\n2. 水與米 1:1，並浸泡半小時，外鍋一杯水\n3. 電鍋跳起後悶 20 分鐘"
                },
                {
                    "category": "配菜",
                    "name": "焗烤馬鈴薯",
                    "ingredients": "馬鈴薯、鮮乳、鮮奶油、胡椒鹽、鮮味炒手、雙色起司絲、水",
                    "notes": "馬鈴薯蒸熟後壓成泥，拌入其餘食材後鋪上起司，烤箱 200 度烤至金黃。"
                }
            ]
        };

        const datePicker = document.getElementById('datePicker');
        const menuContent = document.getElementById('menuContent');
        const dishEditorList = document.getElementById('dishEditorList');
        const jsonOutput = document.getElementById('jsonOutput');
        const syncIndicator = document.getElementById('syncIndicator');
        
        datePicker.value = todayStr;

        async function loadData() {
            try {
                const response = await fetch(`menu_data.json?t=${Date.now()}`);
                if (response.ok) {
                    const fetchedData = await response.json();
                    menuData = { ...menuData, ...fetchedData };
                }
            } catch (e) { console.warn("使用預設範例。"); }
            renderAll(datePicker.value);
        }

        function performAutoSort(date) {
            if (menuData[date] && Array.isArray(menuData[date])) {
                menuData[date].sort((a, b) => {
                    const pA = categoryPriority[a.category] || 99;
                    const pB = categoryPriority[b.category] || 99;
                    return pA - pB;
                });
            }
        }

        function renderAll(date) {
            if (!menuData[date]) menuData[date] = [];
            renderDisplay(date);
            renderAdmin(date);
            updateJsonOutput();
        }

        function renderDisplay(date) {
            const dishes = menuData[date] || [];
            if (dishes.length === 0) {
                menuContent.className = "block text-center py-24 bg-white rounded-3xl border-2 border-dashed border-slate-100 text-slate-300";
                menuContent.innerHTML = `<i class="fas fa-cookie-bite text-3xl mb-4"></i><p>這一天 (${date}) 還沒有排餐喔！</p>`;
                return;
            }

            menuContent.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-start";
            menuContent.innerHTML = dishes.map((dish, i) => {
                const ingredients = (dish.ingredients || "").split(/[、,，]/).filter(s => s.trim()).map(s => 
                    `<span class="inline-block bg-white text-emerald-700 px-2 py-1 rounded-md text-[10px] font-bold mr-1 mb-1 border border-emerald-100 shadow-sm">${s.trim()}</span>`
                ).join('');

                return `
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 flex flex-col overflow-hidden animate-in fade-in duration-300 dish-card">
                    <div class="p-6 flex-1">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-black uppercase tracking-widest text-emerald-500 bg-emerald-50 px-2 py-1 rounded">
                                <i class="fas ${categoryIcons[dish.category] || 'fa-utensils'} mr-1"></i> ${dish.category}
                            </span>
                        </div>
                        <h2 class="text-xl font-black text-slate-800 mb-4">${dish.name || '未命名菜色'}</h2>
                        <div class="flex flex-wrap">${ingredients || '<span class="text-slate-300 text-xs italic">無指定食材</span>'}</div>
                    </div>
                    <div class="p-4 bg-slate-50 border-t border-slate-50 mt-auto">
                        <button onclick="toggleNotes(${i})" class="flex items-center justify-between w-full text-xs font-bold text-slate-500 hover:text-emerald-600 transition-colors focus:outline-none">
                            <span><i class="fas fa-lightbulb mr-2 opacity-50"></i>查看食譜備註</span>
                            <i id="chevron-${i}" class="fas fa-chevron-down transition-transform"></i>
                        </button>
                        <div id="notes-${i}" class="recipe-notes-container">
                            <div class="mt-4 p-4 bg-white rounded-xl text-slate-500 text-[11px] font-medium leading-relaxed border border-slate-100 shadow-inner">
                                ${(dish.notes || "主廚還沒寫下備註...").replace(/\n/g, '<br>')}
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        window.toggleNotes = (i) => {
            const el = document.getElementById(`notes-${i}`);
            const ch = document.getElementById(`chevron-${i}`);
            if (!el) return;
            el.classList.toggle('expanded');
            ch.style.transform = el.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        };

        function renderAdmin(date) {
            const dishes = menuData[date] || [];
            document.getElementById('editingDate').innerText = date;
            
            dishEditorList.innerHTML = dishes.map((dish, i) => `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative group">
                    <div class="absolute -top-3 right-2 flex gap-2">
                        <div class="flex bg-white rounded-full shadow-md border border-slate-100 overflow-hidden">
                            <button onclick="moveDish(${i}, -1)" title="上移" class="w-8 h-8 text-slate-400 hover:bg-slate-50 hover:text-emerald-500 transition-all flex items-center justify-center border-r border-slate-100 disabled:opacity-30" ${i === 0 ? 'disabled' : ''}>
                                <i class="fas fa-arrow-up text-[10px]"></i>
                            </button>
                            <button onclick="moveDish(${i}, 1)" title="下移" class="w-8 h-8 text-slate-400 hover:bg-slate-50 hover:text-emerald-500 transition-all flex items-center justify-center disabled:opacity-30" ${i === dishes.length - 1 ? 'disabled' : ''}>
                                <i class="fas fa-arrow-down text-[10px]"></i>
                            </button>
                        </div>
                        <button onclick="copyToClipboard(${i})" title="複製此菜色" class="w-8 h-8 bg-emerald-500 text-white rounded-full shadow-md hover:bg-emerald-600 transition-all flex items-center justify-center">
                            <i class="fas fa-copy text-xs"></i>
                        </button>
                        <button onclick="removeDish(${i})" title="刪除" class="w-8 h-8 bg-white border border-red-100 text-red-400 rounded-full shadow-md hover:bg-red-500 hover:text-white transition-all flex items-center justify-center">
                            <i class="fas fa-trash-alt text-xs"></i>
                        </button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="md:col-span-1">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">類別</label>
                            <select onchange="syncDish(${i}, 'category', this.value)" class="w-full border border-slate-100 bg-slate-50 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                                ${Object.keys(categoryIcons).map(c => `<option value="${c}" ${dish.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        <div class="md:col-span-3">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">菜色名稱</label>
                            <input type="text" value="${dish.name || ''}" oninput="syncDish(${i}, 'name', this.value)" placeholder="請輸入菜名..." class="w-full border border-slate-100 bg-slate-50 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div class="md:col-span-4">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">食材</label>
                            <input type="text" value="${dish.ingredients || ''}" oninput="syncDish(${i}, 'ingredients', this.value)" placeholder="雞蛋、胡蘿蔔......" class="w-full border border-slate-100 bg-slate-50 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div class="md:col-span-4">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">食譜備註</label>
                            <textarea oninput="syncDish(${i}, 'notes', this.value)" rows="3" placeholder="詳細步驟..." class="w-full border border-slate-100 bg-slate-50 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">${dish.notes || ''}</textarea>
                        </div>
                    </div>
                </div>
            `).join('');

            if (dishes.length === 0) {
                dishEditorList.innerHTML = `<div class="text-center py-10 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-100 text-slate-400 text-sm italic">目前還沒有任何菜色，請點擊下方新增。</div>`;
            }

            const pasteBtn = document.getElementById('pasteDishBtn');
            pasteBtn.classList.toggle('hidden', !dishClipboard);
        }

        window.moveDish = (index, direction) => {
            const date = datePicker.value;
            const dishes = menuData[date];
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= dishes.length) return;
            [dishes[index], dishes[newIndex]] = [dishes[newIndex], dishes[index]];
            renderAll(date);
        };

        document.getElementById('autoSortBtn').addEventListener('click', () => {
            const date = datePicker.value;
            performAutoSort(date);
            renderAll(date);
            showToast("已按主食到甜點順序自動排列");
        });

        window.copyToClipboard = (index) => {
            const date = datePicker.value;
            dishClipboard = JSON.parse(JSON.stringify(menuData[date][index]));
            showToast("菜色已暫存，點擊下方「貼上菜色」按鈕即可重複使用");
            renderAdmin(date);
        };

        document.getElementById('pasteDishBtn').addEventListener('click', () => {
            if (!dishClipboard) return;
            const date = datePicker.value;
            if (!menuData[date]) menuData[date] = [];
            menuData[date].push(JSON.parse(JSON.stringify(dishClipboard)));
            showToast("貼上成功！");
            renderAll(date);
        });

        window.syncDish = (index, field, value) => {
            const date = datePicker.value;
            if (!menuData[date] || !menuData[date][index]) return;
            menuData[date][index][field] = value;
            renderDisplay(date);
            updateJsonOutput();
        };

        window.removeDish = (index) => {
            const date = datePicker.value;
            if (confirm("確定要刪除這道菜嗎？")) {
                menuData[date].splice(index, 1);
                renderAll(date);
            }
        };

        document.getElementById('addDishBtn').addEventListener('click', () => {
            const date = datePicker.value;
            if (!menuData[date]) menuData[date] = [];
            menuData[date].push({ category: '主食', name: '', ingredients: '', notes: '' });
            renderAll(date);
        });

        function updateJsonOutput() {
            jsonOutput.value = JSON.stringify(menuData, null, 4);
            syncIndicator.className = "text-[10px] bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded";
            syncIndicator.innerText = "Auto Sync";
        }

        jsonOutput.addEventListener('input', (e) => {
            try {
                const newData = JSON.parse(e.target.value);
                menuData = newData;
                syncIndicator.className = "text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded";
                syncIndicator.innerText = "JSON Updated";
                const date = datePicker.value;
                renderDisplay(date);
                renderAdmin(date);
            } catch (err) {
                syncIndicator.className = "text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded";
                syncIndicator.innerText = "Invalid JSON";
            }
        });

        function modifyDate(days) {
            const current = new Date(datePicker.value);
            current.setDate(current.getDate() + days);
            datePicker.value = getLocalDateString(current);
            renderAll(datePicker.value);
        }

        document.getElementById('prevDayBtn').addEventListener('click', () => modifyDate(-1));
        document.getElementById('nextDayBtn').addEventListener('click', () => modifyDate(1));
        document.getElementById('todayBtn').addEventListener('click', () => {
            datePicker.value = todayStr;
            renderAll(todayStr);
        });
        datePicker.addEventListener('change', () => renderAll(datePicker.value));

        document.getElementById('adminToggle').addEventListener('click', () => {
            const admin = document.getElementById('adminSection');
            admin.classList.toggle('hidden-section');
            if (!admin.classList.contains('hidden-section')) {
                admin.scrollIntoView({ behavior: 'smooth' });
            }
        });
        document.getElementById('closeAdmin').addEventListener('click', () => {
            document.getElementById('adminSection').classList.add('hidden-section');
        });

        document.getElementById('copyJson').addEventListener('click', () => {
            jsonOutput.select();
            document.execCommand('copy');
            showToast("JSON 代碼已複製並保存您的自定義順序！");
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = `fixed bottom-8 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-6 py-3 rounded-full shadow-2xl opacity-100 z-50 transition-all pointer-events-auto`;
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2500);
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
