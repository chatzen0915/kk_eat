<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kk_eat - 每日食譜管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .hidden-section { display: none; }
        
        /* 備註區塊摺疊效果 */
        .recipe-notes-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .recipe-notes-container.expanded {
            max-height: 1000px;
            transition: max-height 0.5s ease-in;
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- 導航欄 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-600 flex items-center">
                <i class="fas fa-utensils mr-2"></i> kk_eat
            </h1>
            <button id="adminToggle" class="text-sm bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-full transition">
                <i class="fas fa-cog mr-1"></i> 編輯模式
            </button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8">
        
        <!-- 日期導航 -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-8 flex flex-wrap items-center justify-between gap-4 border border-slate-100">
            <div class="flex items-center gap-2">
                <button id="prevDayBtn" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-3 py-2 rounded-lg transition flex items-center">
                    <i class="fas fa-chevron-left mr-1"></i> 前一天
                </button>
                <button id="todayBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium transition flex items-center">
                    今天
                </button>
                <button id="nextDayBtn" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-3 py-2 rounded-lg transition flex items-center">
                    後一天 <i class="fas fa-chevron-right ml-1"></i>
                </button>
            </div>
            <div class="flex items-center gap-3">
                <label for="datePicker" class="font-medium text-slate-500 text-sm">查看日期：</label>
                <input type="date" id="datePicker" class="border border-slate-200 rounded-lg px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>
        </div>

        <!-- 內容顯示區 -->
        <div id="displaySection">
            <div id="menuContent" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 菜色清單會動態插入這裡 -->
            </div>
        </div>

        <!-- 管理編輯區 -->
        <div id="adminSection" class="hidden-section mt-12 pt-8 border-t-2 border-slate-200">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-xl font-black text-slate-800">管理中心 (<span id="editingDate"></span>)</h2>
                    <p class="text-sm text-slate-400">在此修改後，複製下方的 JSON 代碼存回檔案即可。</p>
                </div>
                <button id="closeAdmin" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- 左側：編輯表單 -->
                <div class="lg:col-span-2 space-y-6">
                    <div id="dishEditorList" class="space-y-6">
                        <!-- 動態生成多組輸入框 -->
                    </div>
                    
                    <button id="addDishBtn" class="w-full py-4 border-2 border-dashed border-slate-200 rounded-2xl text-slate-400 hover:border-emerald-500 hover:text-emerald-500 transition-all flex items-center justify-center gap-2">
                        <i class="fas fa-plus-circle"></i> 新增一道菜色
                    </button>
                </div>

                <!-- 右側：JSON 輸出 -->
                <div class="lg:col-span-1">
                    <div class="sticky top-24">
                        <h3 class="font-bold text-slate-600 mb-4 flex items-center justify-between">
                            即時輸出 JSON
                            <span class="text-[10px] bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded">Auto Sync</span>
                        </h3>
                        <textarea id="jsonOutput" readonly class="w-full h-[400px] bg-slate-900 border border-slate-800 rounded-2xl p-4 text-[10px] font-mono text-emerald-400 shadow-inner resize-none focus:outline-none"></textarea>
                        <button id="copyJson" class="w-full mt-4 bg-emerald-600 text-white font-bold py-4 rounded-2xl hover:bg-emerald-700 transition shadow-lg shadow-emerald-200 flex items-center justify-center">
                            <i class="fas fa-copy mr-2"></i> 複製所有 JSON 代碼
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none z-50 text-sm transition-all"></div>

    <script>
        // 修正：使用在地時間取得 YYYY-MM-DD，避免 UTC 導致的換日延遲問題
        const getLocalDateString = (date = new Date()) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const todayStr = getLocalDateString();
        const categoryIcons = {
            '主食': 'fa-bowl-rice',
            '配菜': 'fa-stroopwafel',
            '湯': 'fa-mug-hot',
            '甜點': 'fa-ice-cream',
            '飲料': 'fa-glass-water',
            '其他': 'fa-utensils'
        };

        // 預設範例資料
        let menuData = {
            [todayStr]: [
                {
                    "category": "主食",
                    "name": "招牌咖哩飯",
                    "ingredients": "馬鈴薯, 胡蘿蔔, 洋蔥, 豬肉, 咖哩塊",
                    "notes": "1. 蔬菜先炒過口感更好。\n2. 建議悶 10 分鐘再開鍋。"
                },
                {
                    "category": "甜點",
                    "name": "焦糖布丁",
                    "ingredients": "雞蛋, 鮮奶, 糖",
                    "notes": "焦糖熬煮時不要攪拌，以免反砂。"
                }
            ]
        };

        const datePicker = document.getElementById('datePicker');
        const menuContent = document.getElementById('menuContent');
        const dishEditorList = document.getElementById('dishEditorList');
        const jsonOutput = document.getElementById('jsonOutput');
        
        datePicker.value = todayStr;

        // 1. 載入資料
        async function loadData() {
            try {
                const response = await fetch(`menu_data.json?t=${Date.now()}`);
                if (response.ok) {
                    const fetchedData = await response.json();
                    // 合併資料
                    menuData = { ...menuData, ...fetchedData };
                }
            } catch (e) { console.warn("使用預設範例。"); }
            renderAll(datePicker.value);
        }

        // 渲染畫面
        function renderAll(date) {
            // 重要：如果該日期還沒有資料，先預設為空陣列，這樣 JSON 輸出才會出現該日期
            if (!menuData[date]) {
                menuData[date] = [];
            }
            
            renderDisplay(date);
            renderAdmin(date);
            updateJsonOutput();
        }

        // 2. 前台顯示
        function renderDisplay(date) {
            const dishes = menuData[date] || [];
            if (dishes.length === 0) {
                menuContent.className = "block text-center py-24 bg-white rounded-3xl border-2 border-dashed border-slate-100 text-slate-300";
                menuContent.innerHTML = `<i class="fas fa-cookie-bite text-3xl mb-4"></i><p>這一天 (${date}) 還沒有排餐喔！</p>`;
                return;
            }

            menuContent.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6";
            menuContent.innerHTML = dishes.map((dish, i) => {
                const ingredients = (dish.ingredients || "").split(/[,，]/).filter(s => s.trim()).map(s => 
                    `<span class="inline-block bg-white text-emerald-700 px-2 py-1 rounded-md text-[10px] font-bold mr-1 mb-1 border border-emerald-100 shadow-sm">${s.trim()}</span>`
                ).join('');

                return `
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 flex flex-col h-full overflow-hidden animate-in fade-in duration-300">
                    <div class="p-6 flex-1">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[10px] font-black uppercase tracking-widest text-emerald-500 bg-emerald-50 px-2 py-1 rounded">
                                <i class="fas ${categoryIcons[dish.category] || 'fa-utensils'} mr-1"></i> ${dish.category}
                            </span>
                        </div>
                        <h2 class="text-xl font-black text-slate-800 mb-4">${dish.name || '未命名菜色'}</h2>
                        <div class="flex flex-wrap">${ingredients || '<span class="text-slate-300 text-xs italic">無指定食材</span>'}</div>
                    </div>
                    <div class="p-4 bg-slate-50 border-t border-slate-50">
                        <button onclick="toggleNotes(${i})" class="flex items-center justify-between w-full text-xs font-bold text-slate-500 hover:text-emerald-600 transition-colors">
                            <span><i class="fas fa-lightbulb mr-2 opacity-50"></i>查看食譜備註</span>
                            <i id="chevron-${i}" class="fas fa-chevron-down transition-transform"></i>
                        </button>
                        <div id="notes-${i}" class="recipe-notes-container">
                            <p class="mt-4 p-4 bg-white rounded-xl text-slate-500 text-[11px] leading-relaxed border border-slate-100 shadow-inner">
                                ${(dish.notes || "主廚還沒寫下備註...").replace(/\n/g, '<br>')}
                            </p>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        window.toggleNotes = (i) => {
            const el = document.getElementById(`notes-${i}`);
            const ch = document.getElementById(`chevron-${i}`);
            if (!el) return;
            el.classList.toggle('expanded');
            ch.style.transform = el.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        };

        // 3. 管理編輯區 (填寫即同步)
        function renderAdmin(date) {
            const dishes = menuData[date] || [];
            document.getElementById('editingDate').innerText = date;
            
            dishEditorList.innerHTML = dishes.map((dish, i) => `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative group">
                    <button onclick="removeDish(${i})" class="absolute -top-3 -right-3 w-8 h-8 bg-white border border-red-100 text-red-400 rounded-full shadow-md hover:bg-red-500 hover:text-white transition-all flex items-center justify-center">
                        <i class="fas fa-trash-alt text-xs"></i>
                    </button>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="md:col-span-1">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">類別</label>
                            <select oninput="syncDish(${i}, 'category', this.value)" class="w-full border border-slate-100 bg-slate-50 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                                ${Object.keys(categoryIcons).map(c => `<option value="${c}" ${dish.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        <div class="md:col-span-3">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">菜色名稱</label>
                            <input type="text" value="${dish.name || ''}" oninput="syncDish(${i}, 'name', this.value)" placeholder="請輸入菜名..." class="w-full border border-slate-100 bg-slate-50 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div class="md:col-span-4">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">食材 (逗號隔開)</label>
                            <input type="text" value="${dish.ingredients || ''}" oninput="syncDish(${i}, 'ingredients', this.value)" placeholder="洋蔥, 雞蛋, ..." class="w-full border border-slate-100 bg-slate-50 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div class="md:col-span-4">
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">食譜備註</label>
                            <textarea oninput="syncDish(${i}, 'notes', this.value)" rows="3" placeholder="詳細步驟..." class="w-full border border-slate-100 bg-slate-50 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500">${dish.notes || ''}</textarea>
                        </div>
                    </div>
                </div>
            `).join('');

            if (dishes.length === 0) {
                dishEditorList.innerHTML = `<div class="text-center py-10 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-100 text-slate-400 text-sm italic">目前還沒有任何菜色，請點擊下方新增。</div>`;
            }
        }

        // 同步函數
        window.syncDish = (index, field, value) => {
            const date = datePicker.value;
            if (!menuData[date]) menuData[date] = [];
            if (!menuData[date][index]) return;
            
            menuData[date][index][field] = value;
            renderDisplay(date); // 同步更新預覽
            updateJsonOutput();  // 同步更新 JSON 區塊
        };

        window.removeDish = (index) => {
            const date = datePicker.value;
            if (!menuData[date]) return;
            
            menuData[date].splice(index, 1);
            // 保持 Key 存在，讓 JSON 輸出仍顯示該日期
            renderAll(date);
        };

        document.getElementById('addDishBtn').addEventListener('click', () => {
            const date = datePicker.value;
            if (!menuData[date]) menuData[date] = [];
            menuData[date].push({ category: '主食', name: '', ingredients: '', notes: '' });
            renderAll(date);
        });

        function updateJsonOutput() {
            jsonOutput.value = JSON.stringify(menuData, null, 4);
        }

        // 導航邏輯
        function modifyDate(days) {
            const current = new Date(datePicker.value);
            current.setDate(current.getDate() + days);
            datePicker.value = getLocalDateString(current);
            renderAll(datePicker.value);
        }

        document.getElementById('prevDayBtn').addEventListener('click', () => modifyDate(-1));
        document.getElementById('nextDayBtn').addEventListener('click', () => modifyDate(1));
        document.getElementById('todayBtn').addEventListener('click', () => {
            datePicker.value = todayStr;
            renderAll(todayStr);
        });
        datePicker.addEventListener('change', () => renderAll(datePicker.value));

        // 管理切換
        document.getElementById('adminToggle').addEventListener('click', () => {
            const admin = document.getElementById('adminSection');
            admin.classList.toggle('hidden-section');
            if (!admin.classList.contains('hidden-section')) {
                admin.scrollIntoView({ behavior: 'smooth' });
            }
        });
        document.getElementById('closeAdmin').addEventListener('click', () => {
            document.getElementById('adminSection').classList.add('hidden-section');
        });

        // 複製功能
        document.getElementById('copyJson').addEventListener('click', () => {
            jsonOutput.select();
            document.execCommand('copy');
            showToast("JSON 代碼已複製！請存回 menu_data.json");
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = `fixed bottom-8 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-6 py-3 rounded-full shadow-2xl opacity-100 z-50 transition-all`;
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2500);
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
