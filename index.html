<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kk_eat</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🍴</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #e2e8f0;
        }
        .hidden-section { display: none; }
        
        /* 備註區塊摺疊效果 */
        .recipe-notes-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease;
            opacity: 0;
        }
        .recipe-notes-container.expanded {
            max-height: 2000px;
            opacity: 1;
        }
        
        /* Grid 佈局 */
        .dish-grid {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            align-items: start; 
        }
        @media (min-width: 768px) { .dish-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (min-width: 1024px) { .dish-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        
        .dish-card {
            display: flex;
            flex-direction: column;
            width: 100%;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .dish-card:hover {
            transform: translateY(-3px);
        }

        /* 外食按鈕閃爍效果 */
        .btn-external-active {
            animation: pulse-amber-small 2s infinite;
        }
        @keyframes pulse-amber-small {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        /* JSON 編輯器樣式 */
        #jsonOutput {
            font-family: 'Fira Code', monospace;
            white-space: pre;
            word-wrap: break-word;
            outline: none;
        }
        .json-highlight-block {
            background-color: rgba(16, 185, 129, 0.15); 
            border-left: 4px solid #10b981;
            margin-left: -1rem;
            padding-left: 1rem;
            display: inline-block;
            width: calc(100% + 1rem);
        }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-black text-emerald-600 flex items-center tracking-tight">
                <i class="fas fa-utensils mr-2"></i> kk_eat
            </h1>
            <button id="adminToggle" class="text-xs bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-full transition font-bold text-slate-500 flex items-center gap-1.5 border border-slate-200">
                <i class="fas fa-cog text-xs text-slate-400"></i> 編輯模式
            </button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- 日期導航面板 -->
        <div class="bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden mb-8">
            <div class="p-6 pb-4 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <label for="datePicker" class="font-black text-slate-400 text-[10px] uppercase tracking-[0.2em] ml-1">Calendar</label>
                    <input type="date" id="datePicker" class="border border-slate-200 rounded-xl px-4 py-2 focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-bold bg-slate-50 text-slate-700 shadow-inner">
                </div>

                <div class="flex items-center gap-2">
                    <button id="todayBtn" class="px-5 py-2.5 rounded-xl font-black transition flex items-center text-[10px] shadow-sm tracking-widest uppercase">
                        TODAY
                    </button>
                    <button id="prevDayBtn" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-4 py-2.5 rounded-xl transition flex items-center text-[10px] font-black shadow-sm tracking-widest">
                        <i class="fas fa-chevron-left mr-2"></i> PREV
                    </button>
                    <button id="nextDayBtn" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-4 py-2.5 rounded-xl transition flex items-center text-[10px] font-black shadow-sm tracking-widest">
                        NEXT <i class="fas fa-chevron-right ml-2"></i>
                    </button>
                </div>
            </div>

            <div class="px-6 pb-6 pt-2 border-t border-slate-50 bg-slate-50/50">
                <div class="grid grid-cols-7 gap-2" id="weekBar">
                    <button onclick="jumpToDayInWeek(1)" data-day="1" class="week-btn py-3 rounded-xl text-[10px] font-black transition-all border border-slate-300">MON</button>
                    <button onclick="jumpToDayInWeek(2)" data-day="2" class="week-btn py-3 rounded-xl text-[10px] font-black transition-all border border-slate-300">TUE</button>
                    <button onclick="jumpToDayInWeek(3)" data-day="3" class="week-btn py-3 rounded-xl text-[10px] font-black transition-all border border-slate-300">WED</button>
                    <button onclick="jumpToDayInWeek(4)" data-day="4" class="week-btn py-3 rounded-xl text-[10px] font-black transition-all border border-slate-300">THU</button>
                    <button onclick="jumpToDayInWeek(5)" data-day="5" class="week-btn py-3 rounded-xl text-[10px] font-black transition-all border border-slate-300">FRI</button>
                    <button onclick="jumpToDayInWeek(6)" data-day="6" class="week-btn py-3 rounded-xl text-[10px] font-black transition-all border border-slate-300">SAT</button>
                    <button onclick="jumpToDayInWeek(0)" data-day="0" class="week-btn py-3 rounded-xl text-[10px] font-black transition-all border border-slate-300">SUN</button>
                </div>
            </div>
        </div>

        <div id="displaySection">
            <div id="menuContent" class="dish-grid"></div>
        </div>

        <div id="adminSection" class="hidden-section mt-12 pt-8 border-t-2 border-slate-300">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-xl font-black text-slate-800 tracking-tight">管理中心 (<span id="editingDate"></span>)</h2>
                    <p class="text-xs text-slate-500 font-medium mt-1">修改後複製 JSON 代碼存回即可。</p>
                </div>
                <div class="flex gap-2">
                    <button id="autoSortBtn" class="text-xs bg-white text-slate-600 hover:bg-slate-200 px-4 py-2 rounded-full transition border border-slate-300 font-bold">
                        <i class="fas fa-sort-amount-down-alt mr-1 text-slate-400"></i> 分類排序
                    </button>
                    <button id="closeAdmin" class="text-slate-400 hover:text-slate-600 p-2 transition-transform hover:scale-110"><i class="fas fa-times text-xl"></i></button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 space-y-6">
                    <div id="dishEditorList" class="space-y-6"></div>
                    <div class="flex gap-3">
                        <button id="addDishBtn" class="flex-[2] py-5 border-2 border-dashed border-slate-400 rounded-3xl text-slate-500 hover:border-emerald-500 hover:text-emerald-600 transition-all flex items-center justify-center gap-3 font-black bg-white/50 shadow-sm uppercase tracking-widest text-xs">
                            <i class="fas fa-plus-circle text-lg"></i> Add New Dish
                        </button>
                        <button id="pasteDishBtn" class="hidden flex-1 py-5 bg-orange-50 border-2 border-dashed border-orange-200 rounded-3xl text-orange-600 hover:bg-orange-100 hover:border-orange-400 transition-all flex items-center justify-center gap-3 font-black uppercase tracking-widest text-xs">
                            <i class="fas fa-paste text-lg"></i> Paste
                        </button>
                    </div>
                </div>

                <div class="lg:col-span-1">
                    <div class="sticky top-24">
                        <div class="bg-white rounded-[2rem] p-1 shadow-xl border border-slate-300 overflow-hidden">
                            <h3 class="font-bold text-slate-500 p-4 pb-2 flex items-center justify-between text-[10px] uppercase tracking-widest">
                                JSON Editor
                                <span id="syncIndicator" class="text-[10px] bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded transition-all font-mono">Auto Sync</span>
                            </h3>
                            <div id="jsonOutput" contenteditable="plaintext-only" class="w-full h-[550px] bg-slate-900 border-none p-4 text-[11px] font-mono text-emerald-400 shadow-inner overflow-y-auto" spellcheck="false"></div>
                        </div>
                        <div class="mt-4">
                            <button id="copyJson" class="w-full bg-emerald-600 text-white font-black py-5 rounded-[2rem] hover:bg-emerald-700 transition shadow-lg shadow-emerald-200 flex items-center justify-center gap-3 uppercase tracking-widest text-xs">
                                <i class="fas fa-copy text-sm"></i> Copy JSON
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-8 right-8 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 pointer-events-none z-50 text-sm transition-all font-bold border border-slate-700"></div>

    <script>
        // 修正日期解析：避免時區跳日
        const parseLocalDate = (dateStr) => {
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        };

        const getLocalDateString = (date = new Date()) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const todayStr = getLocalDateString();
        const categoryIcons = {
            '主食': 'fa-bowl-rice',
            '配菜': 'fa-stroopwafel',
            '湯品': 'fa-mug-hot',
            '甜點': 'fa-ice-cream',
            '宵夜': 'fa-moon',
            '其他': 'fa-utensils'
        };

        const categoryPriority = { '主食': 1, '配菜': 2, '湯品': 3, '甜點': 4, '宵夜': 5, '其他': 6 };

        let dishClipboard = null;
        let menuData = {
            [todayStr]: [
                { "category": "主食", "name": "白飯", "ingredients": "白米", "notes": "洗米兩次，水米1:1", "isExternal": false }
            ]
        };

        const datePicker = document.getElementById('datePicker');
        const menuContent = document.getElementById('menuContent');
        const dishEditorList = document.getElementById('dishEditorList');
        const jsonOutput = document.getElementById('jsonOutput');
        const syncIndicator = document.getElementById('syncIndicator');
        const todayBtn = document.getElementById('todayBtn');
        
        datePicker.value = todayStr;

        async function loadData() {
            try {
                const response = await fetch(`menu_data.json?t=${Date.now()}`);
                if (response.ok) {
                    const fetchedData = await response.json();
                    menuData = { ...menuData, ...fetchedData };
                }
            } catch (e) { console.warn("使用預設範例。"); }
            renderAll(datePicker.value, true);
        }

        function performAutoSort(date) {
            if (menuData[date] && Array.isArray(menuData[date])) {
                menuData[date].sort((a, b) => (categoryPriority[a.category] || 99) - (categoryPriority[b.category] || 99));
            }
        }

        function updateWeekBarStyle(date) {
            const currentObj = parseLocalDate(date);
            const dayOfWeek = currentObj.getDay(); 
            
            document.querySelectorAll('.week-btn').forEach(btn => {
                const btnDay = parseInt(btn.getAttribute('data-day'));
                if (btnDay === dayOfWeek) {
                    btn.className = "week-btn py-3 rounded-xl text-[10px] font-black transition-all bg-emerald-500 text-white shadow-md shadow-emerald-200 border-emerald-500";
                } else {
                    btn.className = "week-btn py-3 rounded-xl text-[10px] font-black transition-all bg-white border border-slate-300 text-slate-400 hover:bg-slate-50 shadow-sm";
                }
            });
        }

        window.jumpToDayInWeek = (targetDay) => {
            const current = parseLocalDate(datePicker.value);
            const currentDay = current.getDay(); 
            const currentAdjusted = currentDay === 0 ? 7 : currentDay;
            const targetAdjusted = targetDay === 0 ? 7 : targetDay;
            const diff = targetAdjusted - currentAdjusted;
            current.setDate(current.getDate() + diff);
            const newDateStr = getLocalDateString(current);
            datePicker.value = newDateStr;
            renderAll(newDateStr, true);
        };

        function formatNotesWithLinks(text) {
            if (!text) return "目前尚無內容...";
            const mapsRegex = /(https?:\/\/(?:goo\.gl\/maps|maps\.app\.goo\.gl|www\.google\.com\/maps)[^\s]+)/g;
            let formatted = text.replace(/\n/g, '<br>');
            formatted = formatted.replace(mapsRegex, (url) => {
                return `<a href="${url}" target="_blank" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-emerald-100/50 text-emerald-700 font-bold rounded-xl border border-emerald-200 hover:bg-emerald-500 hover:text-white transition-all my-1 text-[10px] shadow-sm"><i class="fas fa-map-marker-alt"></i> Google Maps</a>`;
            });
            return formatted;
        }

        function renderAll(date, forceHighlight = false) {
            if (!menuData[date]) menuData[date] = [];
            updateWeekBarStyle(date);
            renderDisplay(date);
            renderAdmin(date);
            updateJsonOutput(forceHighlight);
        }

        function renderDisplay(date) {
            const dishes = menuData[date] || [];
            if (dishes.length === 0) {
                menuContent.innerHTML = `<div class="col-span-full text-center py-24 bg-white/40 rounded-[2.5rem] border-2 border-dashed border-slate-300 text-slate-400 shadow-inner"><i class="fas fa-cookie-bite text-3xl mb-4 opacity-50"></i><p class="font-black uppercase tracking-[0.2em] text-[10px]">No Dishes Scheduled</p></div>`;
                return;
            }

            menuContent.innerHTML = dishes.map((dish, i) => {
                const tagBorderColor = dish.isExternal ? 'border-amber-400' : 'border-green-300';
                const ingredients = (dish.ingredients || "").split(/[、,，]/).filter(s => s.trim()).map(s => 
                    `<span class="inline-block bg-white text-slate-600 px-3 py-1.5 rounded-xl text-[10px] font-bold mr-1.5 mb-1.5 border ${tagBorderColor} shadow-sm">${s.trim()}</span>`
                ).join('');

                return `
                <div class="dish-card rounded-[2.5rem] border-2 ${dish.isExternal ? 'bg-amber-100 border-amber-300' : 'bg-green-50 border-green-300 shadow-xl shadow-green-200/20'} flex flex-col overflow-hidden">
                    <div class="p-8">
                        <div class="flex justify-between items-start mb-5">
                            <span class="text-[9px] font-black uppercase tracking-[0.15em] ${dish.isExternal ? 'text-amber-600' : 'text-green-700'} bg-white px-3 py-1.5 rounded-full shadow-sm border border-slate-100">
                                <i class="fas ${categoryIcons[dish.category] || 'fa-utensils'} mr-1.5"></i> ${dish.category}
                            </span>
                            ${dish.isExternal ? '<span class="px-2 py-0.5 bg-amber-500 text-white text-[9px] font-black rounded flex items-center gap-1 shadow-sm"><i class="fas fa-store"></i>外食</span>' : ''}
                        </div>
                        <h2 class="text-xl font-black text-slate-800 mb-5 tracking-tight">${dish.name || '未命名菜色'}</h2>
                        <div class="mb-2">
                            <h3 class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">${dish.isExternal ? '店家名稱 Shop' : '食材 Ingredients'}</h3>
                            <div class="flex flex-wrap">${ingredients || '<span class="text-slate-400 text-[10px] italic">無資料</span>'}</div>
                        </div>
                    </div>
                    <div class="p-5 ${dish.isExternal ? 'bg-white/40' : 'bg-white/50'} border-t border-slate-100 mt-auto">
                        <button onclick="toggleNotes(${i})" class="flex items-center justify-between w-full text-xs font-bold ${dish.isExternal ? 'text-amber-700' : 'text-green-700'} group">
                            <span class="flex items-center ml-2"><i class="fas fa-receipt mr-3 opacity-30 group-hover:opacity-100"></i>${dish.isExternal ? '查看備註' : '查看食譜'}</span>
                            <i id="chevron-${i}" class="fas fa-chevron-down transition-transform text-slate-300 mr-2"></i>
                        </button>
                        <div id="notes-${i}" class="recipe-notes-container">
                            <div class="mt-4 p-6 bg-white/90 rounded-[1.5rem] text-slate-600 text-[11px] font-medium leading-relaxed border border-slate-100 shadow-inner">
                                ${formatNotesWithLinks(dish.notes)}
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        window.toggleNotes = (i) => {
            const el = document.getElementById(`notes-${i}`);
            const ch = document.getElementById(`chevron-${i}`);
            el.classList.toggle('expanded');
            ch.style.transform = el.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        };

        function renderAdmin(date) {
            const dishes = menuData[date] || [];
            document.getElementById('editingDate').innerText = date;
            
            dishEditorList.innerHTML = dishes.map((dish, i) => `
                <div class="bg-white p-7 rounded-[2rem] border-2 relative ${dish.isExternal ? 'bg-amber-50/30 border-amber-400 shadow-md' : 'border-slate-200 shadow-sm'}">
                    <button onclick="toggleExternal(${i})" class="absolute top-1/2 -left-5 -translate-y-1/2 w-11 h-11 rounded-full border-2 flex flex-col items-center justify-center z-10 ${dish.isExternal ? 'bg-amber-500 border-amber-600 text-white btn-external-active' : 'bg-white border-slate-200 text-slate-400 hover:text-emerald-500'}">
                        <i class="fas fa-store text-[16px]"></i>
                        <span class="text-[7px] font-black uppercase">OUT</span>
                    </button>
                    <div class="absolute -top-3 right-5 flex gap-2">
                        <div class="flex bg-white rounded-full shadow-md border border-slate-100 overflow-hidden">
                            <button onclick="moveDish(${i}, -1)" class="w-8 h-8 text-slate-700 hover:bg-slate-50 flex items-center justify-center border-r" ${i === 0 ? 'disabled' : ''}><i class="fas fa-arrow-up text-[10px]"></i></button>
                            <button onclick="moveDish(${i}, 1)" class="w-8 h-8 text-slate-700 hover:bg-slate-50 flex items-center justify-center" ${i === dishes.length - 1 ? 'disabled' : ''}><i class="fas fa-arrow-down text-[10px]"></i></button>
                        </div>
                        <button onclick="copyToClipboard(${i})" class="w-8 h-8 bg-emerald-500 text-white rounded-full shadow-md hover:bg-emerald-600 flex items-center justify-center"><i class="fas fa-copy text-xs"></i></button>
                        <button onclick="removeDish(${i})" class="w-8 h-8 bg-white border border-red-100 text-red-400 rounded-full shadow-md hover:bg-red-500 hover:text-white flex items-center justify-center"><i class="fas fa-trash-alt text-xs"></i></button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
                        <div class="md:col-span-1">
                            <label class="block text-[9px] font-black text-slate-400 uppercase mb-2">Category</label>
                            <select onchange="syncDish(${i}, 'category', this.value)" class="w-full border border-slate-100 bg-slate-50 rounded-xl px-3 py-2.5 text-sm font-bold">
                                ${Object.keys(categoryIcons).map(c => `<option value="${c}" ${dish.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        <div class="md:col-span-3">
                            <label class="block text-[9px] font-black text-slate-400 uppercase mb-2">Name</label>
                            <input type="text" value="${dish.name || ''}" oninput="syncDish(${i}, 'name', this.value)" class="w-full border border-slate-100 bg-slate-50 rounded-xl px-4 py-2.5 text-sm font-bold">
                        </div>
                        <div class="md:col-span-4">
                            <label class="block text-[9px] font-black text-slate-400 uppercase mb-2">${dish.isExternal ? '店家名稱 Shop' : '食材 Ingredients'}</label>
                            <input type="text" value="${dish.ingredients || ''}" oninput="syncDish(${i}, 'ingredients', this.value)" class="w-full border border-slate-100 bg-slate-50 rounded-xl px-4 py-2.5 text-sm">
                        </div>
                        <div class="md:col-span-4">
                            <label class="block text-[9px] font-black text-slate-400 uppercase mb-2">${dish.isExternal ? '備註 Notes' : '食譜 Recipe'}</label>
                            <textarea oninput="syncDish(${i}, 'notes', this.value)" rows="3" class="w-full border border-slate-100 bg-slate-50 rounded-xl px-4 py-3 text-sm">${dish.notes || ''}</textarea>
                        </div>
                    </div>
                </div>
            `).join('');

            if (dishes.length === 0) dishEditorList.innerHTML = `<div class="text-center py-12 bg-slate-100/50 rounded-[2rem] border-2 border-dashed border-slate-200 text-slate-400 text-xs italic uppercase tracking-widest shadow-inner">No dishes here yet.</div>`;
            document.getElementById('pasteDishBtn').classList.toggle('hidden', !dishClipboard);
        }

        window.toggleExternal = (index) => {
            const date = datePicker.value;
            menuData[date][index].isExternal = !menuData[date][index].isExternal;
            renderAll(date, false);
            showToast(menuData[date][index].isExternal ? "已標記為外食" : "已改為自煮模式");
        };

        window.moveDish = (index, direction) => {
            const date = datePicker.value;
            const dishes = menuData[date];
            [dishes[index], dishes[index + direction]] = [dishes[index + direction], dishes[index]];
            renderAll(date, false);
        };

        document.getElementById('autoSortBtn').addEventListener('click', () => {
            const date = datePicker.value;
            performAutoSort(date);
            renderAll(date, true);
            showToast("已按順序自動排列");
        });

        window.copyToClipboard = (index) => {
            dishClipboard = JSON.parse(JSON.stringify(menuData[datePicker.value][index]));
            showToast("菜色已暫存");
            renderAdmin(datePicker.value);
        };

        document.getElementById('pasteDishBtn').addEventListener('click', () => {
            if (!dishClipboard) return;
            const date = datePicker.value;
            if (!menuData[date]) menuData[date] = [];
            menuData[date].push(JSON.parse(JSON.stringify(dishClipboard)));
            renderAll(date, true);
            showToast("貼上成功！");
        });

        window.syncDish = (index, field, value) => {
            const date = datePicker.value;
            menuData[date][index][field] = value;
            renderDisplay(date);
            updateJsonOutput(false);
        };

        window.removeDish = (index) => {
            if (confirm("確定要刪除嗎？")) {
                menuData[datePicker.value].splice(index, 1);
                renderAll(datePicker.value, true);
            }
        };

        document.getElementById('addDishBtn').addEventListener('click', () => {
            const date = datePicker.value;
            if (!menuData[date]) menuData[date] = [];
            menuData[date].push({ category: '主食', name: '', ingredients: '', notes: '', isExternal: false });
            renderAll(date, true);
        });

        function updateJsonOutput(forceHighlight = false) {
            const sortedMenuData = {};
            Object.keys(menuData).sort().forEach(key => { sortedMenuData[key] = menuData[key]; });
            
            const rawJson = JSON.stringify(sortedMenuData, null, 4);
            
            if (forceHighlight) {
                const targetDate = datePicker.value;
                let safeJson = rawJson.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                
                // 強健的高亮 Regex：相容空陣列 [] 與不同的縮排
                const datePattern = new RegExp(`("${targetDate}":\\s*\\[[\\s\\S]*?\\n\\s*\\])`, 'g');
                
                if (safeJson.match(datePattern)) {
                    safeJson = safeJson.replace(datePattern, '<span id="highlighted-json-block" class="json-highlight-block">$1</span>');
                    jsonOutput.innerHTML = safeJson;
                    
                    // 自動滾動到高亮區塊
                    setTimeout(() => {
                        const el = document.getElementById('highlighted-json-block');
                        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 100);
                } else {
                    jsonOutput.innerText = rawJson;
                }
            } else {
                // 如果只是同步內容，不重新渲染 HTML 避免失去焦點
                if (document.activeElement !== jsonOutput) {
                    jsonOutput.innerText = rawJson;
                }
            }
            
            syncIndicator.className = "text-[10px] bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded font-bold shadow-sm";
            syncIndicator.innerText = "Auto Sync";
        }

        jsonOutput.addEventListener('input', () => {
            try {
                const newData = JSON.parse(jsonOutput.innerText);
                menuData = newData;
                syncIndicator.className = "text-[10px] bg-blue-100 text-blue-600 px-2 py-0.5 rounded font-bold";
                syncIndicator.innerText = "JSON Updated";
                renderDisplay(datePicker.value);
                renderAdmin(datePicker.value);
            } catch (err) {
                syncIndicator.className = "text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded font-bold";
                syncIndicator.innerText = "Invalid JSON";
            }
        });

        document.getElementById('prevDayBtn').addEventListener('click', () => {
            const current = parseLocalDate(datePicker.value);
            current.setDate(current.getDate() - 1);
            datePicker.value = getLocalDateString(current);
            renderAll(datePicker.value, true);
        });
        document.getElementById('nextDayBtn').addEventListener('click', () => {
            const current = parseLocalDate(datePicker.value);
            current.setDate(current.getDate() + 1);
            datePicker.value = getLocalDateString(current);
            renderAll(datePicker.value, true);
        });
        document.getElementById('todayBtn').addEventListener('click', () => {
            datePicker.value = todayStr;
            renderAll(todayStr, true);
        });
        datePicker.addEventListener('change', () => renderAll(datePicker.value, true));

        document.getElementById('adminToggle').addEventListener('click', () => {
            const admin = document.getElementById('adminSection');
            admin.classList.toggle('hidden-section');
            if (!admin.classList.contains('hidden-section')) {
                renderAll(datePicker.value, true);
                admin.scrollIntoView({ behavior: 'smooth' });
            }
        });
        document.getElementById('closeAdmin').addEventListener('click', () => document.getElementById('adminSection').classList.add('hidden-section'));

        document.getElementById('copyJson').addEventListener('click', () => {
            const text = jsonOutput.innerText;
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast("JSON 已複製成功！");
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.className = `fixed bottom-8 right-8 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl opacity-100 z-50 transition-all font-bold border border-slate-700`;
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2500);
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
